# agentwall policy. Everything is DENIED unless listed here.
mode = enforce              # enforce = block, monitor = only log (good for a first run)

allow = api.github.com
allow = pypi.org
allow = *.pythonhosted.org  # wildcard matches subdomains only, not pythonhosted.org itself

allow_ports = 443           # if omitted, ports 80 and 443 are allowed
# deny_method = DELETE      # plain-HTTP only; HTTPS tunnels cannot be inspected
# allow_private = myhost    # only if a listed host must resolve to a private address
